2026-08-31:
  ZealousZeke:
  - rscadd: The big manipulator now supports specifying whether the attached monkey
      should use either combat mode, right clicking, or even both.
  - qol: Ejecting monkeys from the big manipulator now uses a UI button instead.
  - bugfix: You can no longer teleport monkeys into impossible areas with big manipulator
      unbuckling.
  - bugfix: You can no longer simultaneously buckle multiple monkeys into the big
      manipulator.
  - bugfix: The big manipulator will now properly clear old refs to former workers.
  - bugfix: Fixed monkeys being weirdly rotated when attached to big manipulators
      pointing sideways
  - refactor: big manipulator ID card locking has been refactored, report any strangeness
      with these!
  - rscadd: Adds a golf cart to cargo imports
  - rscadd: Adds golf carts which can transport crates, machines, fuel tanks, and
      people
  cocothegogo:
  - rscadd: changes the corporate modsuit sprite to be more epic and cool
  - rscadd: Adds sprites for messenger bags worn in belt slot
