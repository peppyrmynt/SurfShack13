name: TEMP Absolution pacifism
on:
  push:
    branches:
      - port-hippie-stands
    paths:
      - .github/workflows/temp-absolution-pacifism.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: port-hippie-stands
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('code/modules/mob/living/basic/guardian/stands/stand_requiem.dme')
          s = p.read_text()

          s = s.replace(
              'rebuild_playstyle("While manifested, form an absolute shield around your summoner, preventing damage and suffocation until you recall.")',
              'rebuild_playstyle("While manifested, form an absolute shield around your summoner, preventing damage and suffocation until you recall. The absolute barrier also prevents both you and your summoner from committing violence while it is active.")',
              1,
          )

          old_apply = '''/datum/status_effect/stand_absolution/on_apply()\n\tADD_TRAIT(owner, TRAIT_GODMODE, STAND_ABSOLUTION_TRAIT)\n\tADD_TRAIT(owner, TRAIT_NOBREATH, STAND_ABSOLUTION_TRAIT)\n\tvar/mob/living/basic/guardian/guardian = guardian_ref?.resolve()\n\tif(guardian)\n\t\tRegisterSignal(guardian, COMSIG_QDELETING, PROC_REF(guardian_deleted))\n\tto_chat(owner, span_holoparasite("An absolute barrier surrounds you."))\n\treturn TRUE'''
          new_apply = '''/datum/status_effect/stand_absolution/on_apply()\n\tADD_TRAIT(owner, TRAIT_GODMODE, STAND_ABSOLUTION_TRAIT)\n\tADD_TRAIT(owner, TRAIT_NOBREATH, STAND_ABSOLUTION_TRAIT)\n\tADD_TRAIT(owner, TRAIT_PACIFISM, STAND_ABSOLUTION_TRAIT)\n\tvar/mob/living/basic/guardian/guardian = guardian_ref?.resolve()\n\tif(guardian)\n\t\tADD_TRAIT(guardian, TRAIT_PACIFISM, STAND_ABSOLUTION_TRAIT)\n\t\tRegisterSignal(guardian, COMSIG_QDELETING, PROC_REF(guardian_deleted))\n\t\tto_chat(guardian, span_holoparasite("Your absolute barrier forbids violence while it protects your summoner."))\n\tto_chat(owner, span_holoparasite("An absolute barrier surrounds you. While it holds, neither you nor your Stand can commit violence."))\n\treturn TRUE'''
          if old_apply not in s:
              raise SystemExit('Absolution on_apply block not found')
          s = s.replace(old_apply, new_apply, 1)

          old_remove = '''/datum/status_effect/stand_absolution/on_remove()\n\tREMOVE_TRAIT(owner, TRAIT_GODMODE, STAND_ABSOLUTION_TRAIT)\n\tREMOVE_TRAIT(owner, TRAIT_NOBREATH, STAND_ABSOLUTION_TRAIT)\n\tvar/mob/living/basic/guardian/guardian = guardian_ref?.resolve()\n\tif(guardian)\n\t\tUnregisterSignal(guardian, COMSIG_QDELETING)\n\tto_chat(owner, span_holoparasite("The absolute barrier fades."))'''
          new_remove = '''/datum/status_effect/stand_absolution/on_remove()\n\tREMOVE_TRAIT(owner, TRAIT_GODMODE, STAND_ABSOLUTION_TRAIT)\n\tREMOVE_TRAIT(owner, TRAIT_NOBREATH, STAND_ABSOLUTION_TRAIT)\n\tREMOVE_TRAIT(owner, TRAIT_PACIFISM, STAND_ABSOLUTION_TRAIT)\n\tvar/mob/living/basic/guardian/guardian = guardian_ref?.resolve()\n\tif(guardian)\n\t\tREMOVE_TRAIT(guardian, TRAIT_PACIFISM, STAND_ABSOLUTION_TRAIT)\n\t\tUnregisterSignal(guardian, COMSIG_QDELETING)\n\t\tto_chat(guardian, span_holoparasite("The absolute barrier fades. You can fight again."))\n\tto_chat(owner, span_holoparasite("The absolute barrier fades. You can fight again."))'''
          if old_remove not in s:
              raise SystemExit('Absolution on_remove block not found')
          s = s.replace(old_remove, new_remove, 1)

          p.write_text(s)
          PY
          git add code/modules/mob/living/basic/guardian/stands/stand_requiem.dme
          git rm .github/workflows/temp-absolution-pacifism.yml
          git commit -m "Balance Absolution with pacifism while active"
          git push origin port-hippie-stands
