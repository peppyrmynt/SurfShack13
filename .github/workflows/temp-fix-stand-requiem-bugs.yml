name: TEMP fix Stand Requiem bugs
on:
  push:
    branches: [port-hippie-stands]
    paths:
      - '.github/workflows/temp-fix-stand-requiem-bugs.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: port-hippie-stands
          fetch-depth: 0
      - name: Apply fixes
        run: python3 .github/scripts/temp_fix_stands.py
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --check
          git rm .github/workflows/temp-fix-stand-requiem-bugs.yml .github/scripts/temp_fix_stands.py
          git add code/modules/mob/living/basic/guardian/stands/stand_normal_powers.dme code/modules/mob/living/basic/guardian/stands/stand_requiem.dme
          git commit -m "Fix Requiem pocket and minor interactions"
          git push origin HEAD:port-hippie-stands
