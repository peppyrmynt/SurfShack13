name: Patch Historical Stand Audio

on:
  push:
    branches:
      - port-hippie-stands

permissions:
  contents: write

jobs:
  patch-stand-audio:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: port-hippie-stands

      - name: Apply historical Stand audio behavior
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected text not found in {path}:\n{old}")
              p.write_text(text.replace(old, new, 1))

          # Gravity: Hippie volume 100, varied pitch, default world.view range (7 tiles).
          replace(
              "code/modules/mob/living/basic/guardian/stands/stand_stats.dme",
              "playsound(source, 'sound/effects/gravhit.ogg', 100, TRUE)",
              "playsound(source, 'sound/effects/gravhit.ogg', 100, TRUE, -10)",
          )

          normal = "code/modules/mob/living/basic/guardian/stands/stand_normal_powers.dme"

          # Explosive trap keeps Hippie's 200 volume + varied pitch, but limits this Stand to the old 7-tile range.
          replace(
              normal,
              "/datum/action/cooldown/mob_cooldown/stand_explosive_trap\n\tparent_type = /datum/action/cooldown/mob_cooldown/explosive_booby_trap\n\tclick_to_activate = TRUE",
              "/datum/action/cooldown/mob_cooldown/stand_explosive_trap\n\tparent_type = /datum/action/cooldown/mob_cooldown/explosive_booby_trap\n\tclick_to_activate = TRUE\n\tsound_extra_range = -10",
          )

          # Frenzy Rush: Hippie vector_rush.ogg, volume 100, no pitch variation, 7-tile range.
          replace(
              normal,
              "\tif(!destination)\n\t\treturn FALSE\n\tguardian.forceMove(destination)",
              "\tif(!destination)\n\t\treturn FALSE\n\tplaysound(guardian, 'sound/effects/stands/vector_rush.ogg', 100, FALSE, -10)\n\tguardian.forceMove(destination)",
          )

          # The Hand: Hippie zahando.ogg, volume 100, varied pitch, 7-tile range.
          replace(
              normal,
              "\tif(!source_turf || !hand_turf)\n\t\treturn FALSE\n\tfor(var/atom/movable/movable in source_turf)",
              "\tif(!source_turf || !hand_turf)\n\t\treturn FALSE\n\tplaysound(guardian, 'sound/effects/stands/zahando.ogg', 100, TRUE, -10)\n\tfor(var/atom/movable/movable in source_turf)",
          )

          # Time Erasure: start/end are direct sounds to the erased group; one old-position end cue is spatial at volume 100.
          replace(
              normal,
              "\tfor(var/mob/living/affected as anything in immune)\n\t\taffected.apply_status_effect(/datum/status_effect/stand_time_erasure, duration)\n\tguardian.visible_message(span_holoparasite(\"The world seems to skip around [guardian] as time is erased!\"))",
              "\tvar/mob/living/spatial_end_source = pick(immune)\n\tfor(var/mob/living/affected as anything in immune)\n\t\tSEND_SOUND(affected, sound('sound/effects/stands/kingcrimson_start.ogg'))\n\t\tvar/turf/end_sound_origin = get_turf(affected)\n\t\taffected.apply_status_effect(/datum/status_effect/stand_time_erasure, duration, affected == spatial_end_source, end_sound_origin)\n\tguardian.visible_message(span_holoparasite(\"The world seems to skip around [guardian] as time is erased!\"))",
          )

          replace(
              normal,
              "\tvar/old_mouse_opacity\n\tvar/old_alpha\n\n/datum/status_effect/stand_time_erasure/on_creation(mob/living/new_owner, duration = 2 SECONDS)\n\tsrc.duration = duration\n\treturn ..()",
              "\tvar/old_mouse_opacity\n\tvar/old_alpha\n\tvar/play_spatial_end_sound = FALSE\n\tvar/turf/spatial_end_sound_origin\n\n/datum/status_effect/stand_time_erasure/on_creation(mob/living/new_owner, duration = 2 SECONDS, play_spatial_end_sound = FALSE, turf/spatial_end_sound_origin)\n\tsrc.duration = duration\n\tsrc.play_spatial_end_sound = play_spatial_end_sound\n\tsrc.spatial_end_sound_origin = spatial_end_sound_origin\n\treturn ..()",
          )

          replace(
              normal,
              "/datum/status_effect/stand_time_erasure/on_remove()\n\tREMOVE_TRAIT(owner, TRAIT_GODMODE, STAND_TIME_ERASURE_TRAIT)",
              "/datum/status_effect/stand_time_erasure/on_remove()\n\tSEND_SOUND(owner, sound('sound/effects/stands/kingcrimson_end.ogg'))\n\tif(play_spatial_end_sound && spatial_end_sound_origin)\n\t\tplaysound(spatial_end_sound_origin, 'sound/effects/stands/kingcrimson_end.ogg', 100, FALSE, -10)\n\tREMOVE_TRAIT(owner, TRAIT_GODMODE, STAND_TIME_ERASURE_TRAIT)",
          )

          # Allow the shared modern explosive component to preserve current behavior by default,
          # while the Stand subclass requests the old 7-tile sound range.
          explosive_action = "code/modules/mob/living/basic/guardian/guardian_types/explosive.dm"
          replace(
              explosive_action,
              "\tvar/decay_time = 1 MINUTES\n\t/// Static list of signals that activate the bomb.",
              "\tvar/decay_time = 1 MINUTES\n\t/// Extra range passed to the trap explosion sound. Defaults to modern behavior.\n\tvar/sound_extra_range = 0\n\t/// Static list of signals that activate the bomb.",
          )
          replace(
              explosive_action,
              "\t\texpire_time = decay_time, \\\n\t\tglow_colour = glow_colour,\\",
              "\t\texpire_time = decay_time, \\\n\t\tglow_colour = glow_colour,\\\n\t\tsound_extra_range = sound_extra_range,\\",
          )

          trap = "code/datums/components/direct_explosive_trap.dm"
          replace(
              trap,
              "\t/// Amount of force to apply\n\tvar/explosive_force\n\t/// Colour for examine notification",
              "\t/// Amount of force to apply\n\tvar/explosive_force\n\t/// Extra range passed to the explosion sound.\n\tvar/sound_extra_range = 0\n\t/// Colour for examine notification",
          )
          replace(
              trap,
              "\texplosive_force = EXPLODE_HEAVY,\n\texpire_time = 1 MINUTES,",
              "\texplosive_force = EXPLODE_HEAVY,\n\tsound_extra_range = 0,\n\texpire_time = 1 MINUTES,",
          )
          replace(
              trap,
              "\tsrc.explosive_force = explosive_force\n\tsrc.glow_colour = glow_colour",
              "\tsrc.explosive_force = explosive_force\n\tsrc.sound_extra_range = sound_extra_range\n\tsrc.glow_colour = glow_colour",
          )
          replace(
              trap,
              "playsound(source, 'sound/effects/explosion/explosion2.ogg', 200, TRUE)",
              "playsound(source, 'sound/effects/explosion/explosion2.ogg', 200, TRUE, sound_extra_range)",
          )

          # Time stop shared implementation gets configurable sound ranges without changing any existing callers.
          timestop = "code/datums/proximity_monitor/fields/timestop.dm"
          replace(
              timestop,
              "\t/// hides time icon effect and mutes sound\n\tvar/hidden = FALSE",
              "\t/// hides time icon effect and mutes sound\n\tvar/hidden = FALSE\n\t/// Extra ranges for the start/end audio; defaults preserve modern behavior.\n\tvar/start_sound_extra_range = -1\n\tvar/end_sound_extra_range = 0",
          )
          replace(
              timestop,
              "playsound(src, 'sound/effects/magic/timeparadox2.ogg', 75, TRUE, frequency = -1)",
              "playsound(src, 'sound/effects/magic/timeparadox2.ogg', 75, TRUE, end_sound_extra_range, frequency = -1)",
          )
          replace(
              timestop,
              "playsound(src, 'sound/effects/magic/timeparadox2.ogg', 75, TRUE, -1)",
              "playsound(src, 'sound/effects/magic/timeparadox2.ogg', 75, TRUE, start_sound_extra_range)",
          )

          requiem = "code/modules/mob/living/basic/guardian/stands/stand_requiem.dme"
          replace(
              requiem,
              "/datum/action/cooldown/mob_cooldown/stand_requiem_time_stop\n\tparent_type = /datum/action/cooldown/mob_cooldown/stand_power",
              "/obj/effect/timestop/magic/stand_requiem\n\t// Hippie used world.view (7 tiles) and -1 extra range on start.\n\tstart_sound_extra_range = -11\n\tend_sound_extra_range = -10\n\n/datum/action/cooldown/mob_cooldown/stand_requiem_time_stop\n\tparent_type = /datum/action/cooldown/mob_cooldown/stand_power",
          )
          replace(
              requiem,
              "new /obj/effect/timestop/magic(get_turf(guardian), 2, 10 SECONDS, immune_atoms)",
              "new /obj/effect/timestop/magic/stand_requiem(get_turf(guardian), 2, 10 SECONDS, immune_atoms)",
          )

          # Meteor bump sound was volume 40, varied pitch, old default 7-tile range.
          meteor = "code/modules/meteors/meteor_types.dm"
          replace(
              meteor,
              "\t///Sound to play when you hit something\n\tvar/meteorsound = 'sound/effects/meteorimpact.ogg'",
              "\t///Sound to play when you hit something\n\tvar/meteorsound = 'sound/effects/meteorimpact.ogg'\n\t/// Extra range for the collision sound. Defaults preserve modern meteor behavior.\n\tvar/meteor_sound_extra_range = 0",
          )
          replace(
              meteor,
              "playsound(src.loc, meteorsound, 40, TRUE)",
              "playsound(src.loc, meteorsound, 40, TRUE, meteor_sound_extra_range)",
          )

          arrow = "code/modules/mob/living/basic/guardian/stands/stand_arrow.dme"
          replace(
              arrow,
              "\tmeteorsound = 'sound/effects/bamf.ogg'\n\tmeteordrop = list(/obj/item/stand_arrow)",
              "\tmeteorsound = 'sound/effects/bamf.ogg'\n\tmeteor_sound_extra_range = -10\n\tmeteordrop = list(/obj/item/stand_arrow)",
          )
          PY

      - name: Commit historical audio wiring
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add code sound/effects/stands
          git diff --cached --check
          git commit -m "Restore Hippie Stand sound behavior"
          git push origin HEAD:port-hippie-stands
