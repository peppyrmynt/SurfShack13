name: TEMP Stand Requiem feedback
on:
  push:
    branches:
      - port-hippie-stands
    paths:
      - .github/workflows/temp-stand-requiem-feedback.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: port-hippie-stands
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - run: |
          python3 - <<'PY'
          from pathlib import Path

          verbs = Path('code/modules/mob/living/basic/guardian/guardian_verbs.dm')
          s = verbs.read_text()
          marker = "\tfor(var/mob/living/basic/guardian/resetting_guardian as anything in guardians)\n\t\tif (!COOLDOWN_FINISHED(resetting_guardian, resetting_cooldown))"
          replacement = "\tfor(var/mob/living/basic/guardian/resetting_guardian as anything in guardians)\n\t\t// Arrow-awakened Stands keep their original ghost permanently.\n\t\tif(resetting_guardian.GetComponent(/datum/component/arrow_stand))\n\t\t\tguardians -= resetting_guardian\n\t\t\tcontinue\n\t\tif (!COOLDOWN_FINISHED(resetting_guardian, resetting_cooldown))"
          if marker not in s:
              raise SystemExit('guardian reset insertion point not found')
          s = s.replace(marker, replacement, 1)
          old_msg = 'to_chat(owner, span_holoparasite("You cannot reset [length(guardians) > 1 ? \\"any of your guardians\\" : \\"your guardian\\"] yet."))'
          if old_msg in s:
              s = s.replace(old_msg, 'to_chat(owner, span_holoparasite("None of your linked guardians are eligible for a consciousness reset. Arrow-awakened Stands are permanently bound to their original spirit."))', 1)
          verbs.write_text(s)

          arrow = Path('code/modules/mob/living/basic/guardian/stands/stand_arrow.dme')
          s = arrow.read_text()
          marker = '\tguardian.visible_message(span_holoparasite("[src] is absorbed into [guardian] as [guardian] becomes Requiem!"))'
          replacement = '\tguardian.visible_message(span_holoparasite("[src] is absorbed into [guardian] as [guardian] becomes Requiem and awakens [stand_component.power.name]!"))\n\tto_chat(guardian, span_boldholoparasite("REQUIEM AWAKENED: [stand_component.power.name]. Your former major ability has evolved into this Requiem power. [stand_component.stats.describe()] You also gain Surveillance Snares and Teleportation Pad."))\n\tif(!QDELETED(guardian.summoner))\n\t\tto_chat(guardian.summoner, span_boldholoparasite("Your Stand has awakened Requiem: [stand_component.power.name]. Its stats have increased, and it has gained Surveillance Snares and Teleportation Pad."))'
          if marker not in s:
              raise SystemExit('requiem completion insertion point not found')
          arrow.write_text(s.replace(marker, replacement, 1))
          PY
          git add code/modules/mob/living/basic/guardian/guardian_verbs.dm code/modules/mob/living/basic/guardian/stands/stand_arrow.dme
          git rm .github/workflows/temp-stand-requiem-feedback.yml
          git commit -m "Lock Stand controllers and clarify Requiem awakening"
          git push origin port-hippie-stands
