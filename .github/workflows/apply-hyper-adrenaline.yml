name: Apply Hyper Adrenaline implementation

on:
  push:
    branches:
      - agent/hyper-adrenaline
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-source-changes:
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/hyper-adrenaline
          fetch-depth: 0

      - name: Apply exact source edits
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, marker):
              file_path = Path(path)
              text = file_path.read_text(encoding="utf-8")
              if marker in text:
                  print(f"Already applied: {path}")
                  return
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"Expected one match in {path}, found {count}")
              file_path.write_text(text.replace(old, new, 1), encoding="utf-8")
              print(f"Updated: {path}")

          replace_once(
              "code/__DEFINES/combat.dm",
              "/*ALL DEFINES RELATED TO COMBAT GO HERE*/\n\n//Damage and status effect defines",
              """/*ALL DEFINES RELATED TO COMBAT GO HERE*/

/*
 * HYPER ADRENALINE
 *
 * Central multipliers for the intentionally extreme high-intensity balance
 * overhaul. Player max health and default movement speed are not modified.
 */
#define HYPER_ADRENALINE_ACTION_TIME_MULTIPLIER 0.5
#define HYPER_ADRENALINE_CHEM_EFFECT_MULTIPLIER 2
#define HYPER_ADRENALINE_EXPLOSION_MULTIPLIER 2
#define HYPER_ADRENALINE_EMBED_CHANCE_MULTIPLIER 2
#define HYPER_ADRENALINE_WOUND_MULTIPLIER 2

//Damage and status effect defines""",
              "HYPER_ADRENALINE_ACTION_TIME_MULTIPLIER",
          )

          replace_once(
              "config/game_options.txt",
              "##Damage multiplier, effects both weapons and healing on all mobs. For example, 1.25 would result in 25% higher damage.\nDAMAGE_MULTIPLIER 1",
              """## HYPER ADRENALINE
## Damage multiplier affects both damage and healing on all mobs.
## Max health remains unchanged.
DAMAGE_MULTIPLIER 2""",
              "## HYPER ADRENALINE",
          )

          replace_once(
              "code/__HELPERS/mobs.dm",
              """\tif(!isnum(delay))
\t\tCRASH(\"do_after was passed a non-number delay: [delay || \\\"null\\\"].\")

\tif(!interaction_key && target)""",
              """\tif(!isnum(delay))
\t\tCRASH(\"do_after was passed a non-number delay: [delay || \\\"null\\\"].\")

\t// HYPER ADRENALINE: all shared progress/action-bar interactions take half as long.
\tdelay *= HYPER_ADRENALINE_ACTION_TIME_MULTIPLIER

\tif(!interaction_key && target)""",
              "all shared progress/action-bar interactions take half as long",
          )

          replace_once(
              "code/game/objects/items.dm",
              "/obj/item/Initialize(mapload)\n\tif(attack_verb_continuous)",
              """/obj/item/Initialize(mapload)
\t// HYPER ADRENALINE: thrown objects have twice their normal impact force.
\tthrowforce *= 2

\tif(attack_verb_continuous)""",
              "thrown objects have twice their normal impact force",
          )

          replace_once(
              "code/datums/embedding.dm",
              """/datum/embedding/proc/roll_embed_chance(mob/living/carbon/victim, hit_zone, datum/thrownthing/throwingdatum)
\tvar/chance = embed_chance""",
              """/datum/embedding/proc/roll_embed_chance(mob/living/carbon/victim, hit_zone, datum/thrownthing/throwingdatum)
\t// HYPER ADRENALINE: double base embed chance for thrown items and projectiles.
\tvar/chance = min(embed_chance * HYPER_ADRENALINE_EMBED_CHANCE_MULTIPLIER, 100)""",
              "double base embed chance for thrown items and projectiles",
          )

          replace_once(
              "code/datums/embedding.dm",
              """\tif (is_harmless())
\t\treturn prob(embed_chance)""",
              """\tif (is_harmless())
\t\treturn prob(chance)""",
              "return prob(chance)",
          )

          replace_once(
              "code/modules/surgery/bodyparts/wounds.dm",
              """\tSHOULD_CALL_PARENT(TRUE)
\tRETURN_TYPE(/datum/wound)

\tif(HAS_TRAIT(owner, TRAIT_NEVER_WOUNDED)""",
              """\tSHOULD_CALL_PARENT(TRUE)
\tRETURN_TYPE(/datum/wound)

\t// HYPER ADRENALINE: all eligible injuries have twice the normal wounding potential.
\tdamage *= HYPER_ADRENALINE_WOUND_MULTIPLIER

\tif(HAS_TRAIT(owner, TRAIT_NEVER_WOUNDED)""",
              "all eligible injuries have twice the normal wounding potential",
          )

          replace_once(
              "code/modules/reagents/chemistry/holder/mob_life.dm",
              "/datum/reagents/proc/metabolize(mob/living/carbon/owner, seconds_per_tick, times_fired, can_overdose = FALSE, liverless = FALSE, dead = FALSE)\n\tvar/list/cached_reagents = reagent_list",
              """/datum/reagents/proc/metabolize(mob/living/carbon/owner, seconds_per_tick, times_fired, can_overdose = FALSE, liverless = FALSE, dead = FALSE)
\t// HYPER ADRENALINE: chem effects, overdose processing and metabolism run twice as fast.
\tseconds_per_tick *= HYPER_ADRENALINE_CHEM_EFFECT_MULTIPLIER

\tvar/list/cached_reagents = reagent_list""",
              "chem effects, overdose processing and metabolism run twice as fast",
          )

          replace_once(
              "code/modules/reagents/chemistry/holder/mob_life.dm",
              "/datum/reagents/proc/handle_stasis_chems(mob/living/carbon/owner, seconds_per_tick, times_fired)\n\tvar/need_mob_update = FALSE",
              """/datum/reagents/proc/handle_stasis_chems(mob/living/carbon/owner, seconds_per_tick, times_fired)
\t// HYPER ADRENALINE: keep stasis-ignoring chems on the same accelerated scale.
\tseconds_per_tick *= HYPER_ADRENALINE_CHEM_EFFECT_MULTIPLIER

\tvar/need_mob_update = FALSE""",
              "keep stasis-ignoring chems on the same accelerated scale",
          )

          replace_once(
              "code/controllers/subsystem/explosions.dm",
              "/proc/explosion(atom/origin, devastation_range = 0, heavy_impact_range = 0, light_impact_range = 0, flame_range = null, flash_range = null, adminlog = TRUE, ignorecap = FALSE, silent = FALSE, smoke = FALSE, protect_epicenter = FALSE, atom/explosion_cause = null, explosion_direction = 0, explosion_arc = 360)\n\t. = SSexplosions.explode(arglist(args))",
              """/proc/explosion(atom/origin, devastation_range = 0, heavy_impact_range = 0, light_impact_range = 0, flame_range = null, flash_range = null, adminlog = TRUE, ignorecap = FALSE, silent = FALSE, smoke = FALSE, protect_epicenter = FALSE, atom/explosion_cause = null, explosion_direction = 0, explosion_arc = 360)
\t// HYPER ADRENALINE: double explosion reach, including chemical explosions.
\tdevastation_range *= HYPER_ADRENALINE_EXPLOSION_MULTIPLIER
\theavy_impact_range *= HYPER_ADRENALINE_EXPLOSION_MULTIPLIER
\tlight_impact_range *= HYPER_ADRENALINE_EXPLOSION_MULTIPLIER

\tif(!isnull(flame_range))
\t\tflame_range *= HYPER_ADRENALINE_EXPLOSION_MULTIPLIER

\tif(!isnull(flash_range))
\t\tflash_range *= HYPER_ADRENALINE_EXPLOSION_MULTIPLIER

\t. = SSexplosions.explode(arglist(args))""",
              "double explosion reach, including chemical explosions",
          )
          PY

      - name: Check source diff
        run: git diff --check

      - name: Commit source implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            code/__DEFINES/combat.dm \
            config/game_options.txt \
            code/__HELPERS/mobs.dm \
            code/game/objects/items.dm \
            code/datums/embedding.dm \
            code/modules/surgery/bodyparts/wounds.dm \
            code/modules/reagents/chemistry/holder/mob_life.dm \
            code/controllers/subsystem/explosions.dm
          if git diff --cached --quiet; then
            echo "All Hyper Adrenaline source edits were already present."
            exit 0
          fi
          git commit -m "Implement Hyper Adrenaline gameplay changes"
          git push origin HEAD:agent/hyper-adrenaline
