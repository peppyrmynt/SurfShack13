name: Import Hippie traitor assets

on:
  push:
    branches:
      - restore-classic-atmos-fusion

permissions:
  contents: write

jobs:
  import-assets:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: restore-classic-atmos-fusion
          fetch-depth: 0

      - name: Download original HippieStation assets
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://raw.githubusercontent.com/HippieStation/HippieStationdeprecated2020/22c0ba3bda0d5b3e3b432b744489b13afa16257f"
          ICONS="surfshack13/icons/hippie"
          SOUNDS="surfshack13/sound/hippie"
          mkdir -p "$ICONS" "$SOUNDS"

          curl -fL "$BASE/hippiestation/icons/obj/items_and_weapons.dmi" -o "$ICONS/energy_chainsaw.dmi"
          curl -fL "$BASE/hippiestation/icons/mob/inhands/lefthand.dmi" -o "$ICONS/energy_chainsaw_lefthand.dmi"
          curl -fL "$BASE/hippiestation/icons/mob/inhands/righthand.dmi" -o "$ICONS/energy_chainsaw_righthand.dmi"
          curl -fL "$BASE/hippiestation/icons/obj/device.dmi" -o "$ICONS/device.dmi"

          curl -fL "$BASE/hippiestation/icons/obj/hfblade.dmi" -o "$ICONS/hfblade.dmi"
          curl -fL "$BASE/hippiestation/icons/mob/inhands/weapons/melee_lefthand.dmi" -o "$ICONS/hfblade_lefthand.dmi"
          curl -fL "$BASE/hippiestation/icons/mob/inhands/weapons/melee_righthand.dmi" -o "$ICONS/hfblade_righthand.dmi"
          curl -fL "$BASE/hippiestation/icons/mob/hfblade.dmi" -o "$ICONS/hfblade_worn.dmi"

          curl -fL "$BASE/hippiestation/icons/obj/nanosuit.dmi" -o "$ICONS/nanosuit.dmi"
          curl -fL "$BASE/hippiestation/icons/mob/nanosuit.dmi" -o "$ICONS/nanosuit_worn.dmi"
          curl -fL "$BASE/hippiestation/icons/mob/actions/actions_nanosuit.dmi" -o "$ICONS/actions_nanosuit.dmi"

          curl -fL "$BASE/hippiestation/sound/weapons/echainsawon.ogg" -o "$SOUNDS/echainsawon.ogg"
          curl -fL "$BASE/hippiestation/sound/weapons/echainsawoff.ogg" -o "$SOUNDS/echainsawoff.ogg"
          curl -fL "$BASE/hippiestation/sound/weapons/echainsawhit1.ogg" -o "$SOUNDS/echainsawhit1.ogg"
          curl -fL "$BASE/hippiestation/sound/weapons/echainsawhit2.ogg" -o "$SOUNDS/echainsawhit2.ogg"
          curl -fL "$BASE/hippiestation/sound/weapons/hfblade-music1.ogg" -o "$SOUNDS/hfblade-music1.ogg"
          curl -fL "$BASE/hippiestation/sound/weapons/hfblade-music2.ogg" -o "$SOUNDS/hfblade-music2.ogg"
          curl -fL "$BASE/hippiestation/sound/misc/nanosuitengage.ogg" -o "$SOUNDS/nanosuitengage.ogg"
          curl -fL "$BASE/hippiestation/sound/misc/squishy.ogg" -o "$SOUNDS/squishy.ogg"

      - name: Restore CryNet head-stomp sound
        shell: python
        run: |
          from pathlib import Path
          p = Path("surfshack13/code/modules/uplink/uplink_items/crynet_nanosuit.dm")
          text = p.read_text()
          old = '\thead.dismember()\n\tdefender.apply_damage(40, BRUTE, BODY_ZONE_HEAD, wound_bonus = CANT_WOUND)'
          new = "\tplaysound(defender, 'surfshack13/sound/hippie/squishy.ogg', 75, TRUE)\n\thead.dismember()\n\tdefender.apply_damage(40, BRUTE, BODY_ZONE_HEAD, wound_bonus = CANT_WOUND)"
          if old not in text:
              raise SystemExit("CryNet head-stomp patch point not found")
          p.write_text(text.replace(old, new, 1))

      - name: Commit imported assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/import_hippie_traitor_assets.yml
          git add surfshack13/icons/hippie surfshack13/sound/hippie surfshack13/code/modules/uplink/uplink_items/crynet_nanosuit.dm
          git commit -m "Import original Hippie traitor sprites and sounds"
          git push origin HEAD:restore-classic-atmos-fusion
